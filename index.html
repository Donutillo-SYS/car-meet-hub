<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Meet Hub</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#16161d;--mut:#6b6b78;--line:#dcdce3;--acc:#e8175d;--acc2:#ff9f1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e13;--card:#1a1a22;--ink:#f1f1f5;--mut:#9a9aa8;--line:#2d2d38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e13;--card:#1a1a22;--ink:#f1f1f5;--mut:#9a9aa8;--line:#2d2d38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{margin:0;font-size:26px;letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;margin:18px 0 8px}
.sub{color:var(--mut);margin:2px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
.tab.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;flex:1 1 140px}
.meet{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.meet b{font-size:16px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car img,.car .ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.car .nm{font-weight:700;margin-top:8px}
.bar{height:6px;background:var(--bg);border-radius:4px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.crown{color:var(--acc2);font-weight:700}
.table{width:100%;border-collapse:collapse}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase}
.paste{border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--mut);text-align:center;flex:1 1 100%;cursor:text}.paste:focus{outline:2px solid var(--acc)}.paste img{max-width:160px;border-radius:8px;display:block;margin:6px auto 0}
.hide{display:none}
.note{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;color:var(--mut);font-size:13px;margin-bottom:10px}

/* sunset theme */
:root{--bg:rgba(255,255,255,.55);--card:rgba(255,255,255,.66);--ink:#2b1646;--mut:#6d557f;--line:rgba(120,70,140,.28);--acc:#e0408a;--acc2:#f2813c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgba(20,10,38,.55);--card:rgba(34,18,56,.66);--ink:#fff1f6;--mut:#d8bfe2;--line:rgba(255,200,230,.24)}:root:not([data-theme="light"]) body::before{filter:brightness(.5) saturate(1.15)}}
:root[data-theme="dark"]{--bg:rgba(20,10,38,.55);--card:rgba(34,18,56,.66);--ink:#fff1f6;--mut:#d8bfe2;--line:rgba(255,200,230,.24)}
:root[data-theme="dark"] body::before{filter:brightness(.5) saturate(1.15)}

body{background:transparent}

<body>
<div class="wrap">
<h1>Car Meet Hub</h1>
<p class="sub">GTA Online car meets: entries, votes and the all-time leaderboard.</p>
<div class="tabs"><button class="tab on" data-tab="meets">Meets</button><button class="tab" data-tab="gallery">Best Cars</button><button class="tab" data-tab="board">Leaderboard</button></div>
<div id="warn" class="note hide">Live data isn’t available here, so meets and votes can’t be saved. Open the published link while signed in.</div>

<section id="v-meets">
  <div id="newMeet" class="card hide">
    <b>New car meet</b>
    <div class="row" style="margin-top:8px"><input id="mName" placeholder="Meet name (e.g. Friday Night LS Meet)"><input id="mDate" type="date" style="flex:0 1 160px"><button class="pri" data-act="addMeet">Create</button></div>
  </div>
  <div id="meetList"></div>
</section>

<section id="v-detail" class="hide">
  <div class="row"><button data-act="back">← All meets</button><button class="sm hide" id="delMeet" data-act="delMeet">Delete meet</button></div>
  <h2 id="dTitle"></h2><div class="mut" id="dSub"></div>
  <div class="row hide" id="dlEdit" style="margin-top:6px"><span class="mut">Voting deadline</span><input id="dDead" type="datetime-local" style="flex:0 1 200px"><button class="sm" data-act="setDead">Save</button><button class="sm" data-act="clearDead">Clear</button></div>
  <div id="addForm" class="card hide" style="margin-top:12px">
    <b>Add an entry</b>
    <div class="row" style="margin-top:8px"><input id="ePlayer" placeholder="Player name"><input id="eCar" placeholder="Car (e.g. Pfister Comet S2)"></div>
    <div class="row" style="margin-top:8px"><div id="pasteBox" class="paste" tabindex="0">Take a screenshot, then press Ctrl+V (⌘V on Mac) to paste it here<div id="pasteView"></div></div><input id="eFile" type="file" accept="image/*"><button class="pri" id="eBtn" data-act="addEntry">Add</button></div>
    <div class="mut" id="eMsg" style="margin-top:6px"></div>
  </div>
  <div id="entryList" class="grid" style="margin-top:12px"></div>
</section>

<section id="v-gallery" class="hide"><div id="galBox" class="grid"></div></section>
<section id="v-board" class="hide"><div id="boardBox"></div></section>
</div>

<script>
let meets=[],votes={},uid=null,db=null,assets=null,canEdit=false,sel=null,tab='meets';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
let pasted=null,lastSig='';
const isOpen=m=>!m.deadline||Date.now()<new Date(m.deadline).getTime();
const dl=v=>v?new Date(v).toISOString():'';
const loc=iso=>{if(!iso)return'';const d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);};
const dlTxt=m=>m.deadline?(isOpen(m)?'voting ends '+new Date(m.deadline).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'voting closed'):'';
function setShot(f){pasted=f;$('pasteView').innerHTML='';if(f){const i=new Image();i.src=URL.createObjectURL(f);$('pasteView').appendChild(i);}}
document.addEventListener('paste',ev=>{
  if($('addForm').classList.contains('hide'))return;
  const it=[...(ev.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  const f=it&&it.getAsFile();
  if(f){ev.preventDefault();setShot(f);}
});
$('eFile').addEventListener('change',()=>{if($('eFile').files[0])setShot($('eFile').files[0]);});
setInterval(()=>{const s=meets.map(m=>isOpen(m)?1:0).join('');if(s!==lastSig){lastSig=s;render();}},15000);

(async()=>{
  try{
    const user=await claude.use('user');
    if(user){canEdit=user.canEdit();uid=await user.id();}
    db=await claude.use('db');
    assets=await claude.use('assets');
  }catch(e){}
  if(db){
    db.collection('meets').onSnapshot(s=>{meets=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));render();});
    db.collection('votes').onSnapshot(s=>{votes={};s.docs.forEach(d=>{votes[d.id]=d.data().byMeet||{};});render();});
  }
  render();
})();

function tally(m){
  const t={};(m.entrants||[]).forEach(e=>t[e.id]=+e.sv||0);
  Object.values(votes).forEach(v=>{const p=v[m.id];if(p in t)t[p]++;});
  return t;
}

function render(){
  $('warn').classList.toggle('hide',!!db);
  $('v-meets').classList.toggle('hide',tab!=='meets'||!!sel);
  $('v-detail').classList.toggle('hide',tab!=='meets'||!sel);
  $('v-board').classList.toggle('hide',tab!=='board');
  $('v-gallery').classList.toggle('hide',tab!=='gallery');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('newMeet').classList.toggle('hide',!(canEdit&&db));
  $('meetList').innerHTML=meets.length?meets.map(m=>{
    const n=(m.entrants||[]).length;
    return `<div class="card meet" data-act="open" data-id="${esc(m.id)}"><div><b>${esc(m.name)}</b><div class="mut">${[m.date||'No date',dlTxt(m)].filter(Boolean).join(' · ')} · ${n} car${n===1?'':'s'}</div></div><span class="mut">Open →</span></div>`;
  }).join(''):`<div class="card mut">No meets yet.${canEdit?' Create the first one above.':''}</div>`;
  const m=meets.find(x=>x.id===sel);
  if(sel&&!m){sel=null;return render();}
  if(m)renderDetail(m);
  if(tab==='board')renderBoard();
  if(tab==='gallery')renderGallery();
}

function renderDetail(m){
  $('dTitle').textContent=m.name;
  const open=isOpen(m);
  $('dSub').textContent=[m.date,dlTxt(m),uid?'':'sign in to vote'].filter(Boolean).join(' · ');
  $('dlEdit').classList.toggle('hide',!canEdit);
  if(document.activeElement!==$('dDead'))$('dDead').value=loc(m.deadline);
  $('addForm').classList.toggle('hide',!canEdit);
  $('delMeet').classList.toggle('hide',!canEdit);
  const t=tally(m),max=Math.max(1,...Object.values(t)),top=Math.max(0,...Object.values(t));
  const mine=(votes[uid]||{})[m.id];
  if(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('#entryList input'))return;
  $('entryList').innerHTML=(m.entrants||[]).length?m.entrants.map(e=>{
    const n=t[e.id]||0;
    return `<div class="card car">${e.img?`<img src="${esc(e.img)}" alt="">`:`<div class="ph">No screenshot</div>`}
    <div class="nm">${esc(e.car)} ${top>0&&n===top?'<span class="crown">👑</span>':''}</div>
    <div class="mut">${esc(e.player)}</div>
    <div class="bar"><i style="width:${n/max*100}%"></i></div>
    ${canEdit?`<label class="mut row" style="margin-bottom:6px">Twitch votes <input type="number" min="0" value="${+e.sv||0}" data-act="sv" data-id="${esc(e.id)}" style="flex:0 1 80px"></label>`:''}
    <div class="row" style="justify-content:space-between"><span>${n} vote${n===1?'':'s'}${e.sv?` <span class="mut">(${+e.sv} Twitch)</span>`:''}</span>
    <span><button class="sm ${mine===e.id?'pri':''}" data-act="vote" data-id="${esc(e.id)}" ${uid&&db&&open?'':'disabled'}>${mine===e.id?'Your vote ✓':(open?'Vote':'Closed')}</button>
    ${canEdit?`<button class="sm" data-act="delEntry" data-id="${esc(e.id)}">✕</button>`:''}</span></div></div>`;
  }).join(''):`<div class="card mut">No entries yet.</div>`;
}

function renderGallery(){
  const out=[];
  meets.forEach(m=>{
    const t=tally(m),top=Math.max(0,...Object.values(t));
    if(top<=0)return;
    const fin=m.deadline&&!isOpen(m);
    (m.entrants||[]).filter(e=>t[e.id]===top).forEach(e=>out.push(`<div class="card car">${e.img?`<img src="${esc(e.img)}" alt="">`:'<div class="ph">No screenshot</div>'}<div class="nm">${esc(e.car)} <span class="crown">👑</span></div><div class="mut">${esc(e.player)}</div><div class="mut">${esc(m.name)} · ${top} vote${top===1?'':'s'}</div><div class="crown">${fin?'Winner':'Leading'}</div></div>`));
  });
  $('galBox').innerHTML=out.length?out.join(''):'<div class="card mut">Best cars from each meet show up here once votes come in.</div>';
}

function renderBoard(){
  const P={};
  meets.forEach(m=>{
    const t=tally(m),top=Math.max(0,...Object.values(t));
    (m.entrants||[]).forEach(e=>{
      const k=e.player.trim().toLowerCase(),n=t[e.id]||0;
      const p=P[k]||(P[k]={name:e.player,meets:0,votes:0,wins:0,best:'',bestN:-1});
      p.meets++;p.votes+=n;
      if(top>0&&n===top)p.wins++;
      if(n>p.bestN){p.bestN=n;p.best=e.car;}
    });
  });
  const rows=Object.values(P).sort((a,b)=>b.wins-a.wins||b.votes-a.votes||b.meets-a.meets);
  $('boardBox').innerHTML=rows.length?`<div class="card scroll"><table class="table"><tr><th>#</th><th>Player</th><th>Wins</th><th>Votes</th><th>Meets</th><th>Top car</th></tr>${rows.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td class="crown">${p.wins}</td><td>${p.votes}</td><td>${p.meets}</td><td>${esc(p.best)}</td></tr>`).join('')}</table></div><div class="mut">A win is the most votes at a meet (ties share it). Ranked by wins, then total votes.</div>`:`<div class="card mut">The leaderboard fills up once meets have entries and votes.</div>`;
}

async function addEntry(){
  const m=meets.find(x=>x.id===sel);if(!m)return;
  const player=$('ePlayer').value.trim(),car=$('eCar').value.trim(),f=pasted;
  if(!player||!car){$('eMsg').textContent='Enter a player name and a car.';return;}
  $('eBtn').disabled=true;$('eMsg').textContent=f?'Uploading…':'';
  let img='';
  try{
    if(f){
      if(!assets)$('eMsg').textContent='Screenshot upload isn’t available; adding without one.';
      else img=(await assets.upload(f)).url;
    }
    await db.collection('meets').doc(m.id).update({entrants:[...(m.entrants||[]),{id:rid(),player,car,img}]});
    $('ePlayer').value='';$('eCar').value='';$('eFile').value='';setShot(null);$('eMsg').textContent='';
  }catch(e){$('eMsg').textContent='Couldn’t save: '+(e.message||e.code||'error');}
  $('eBtn').disabled=false;
}

async function vote(eid){
  const m=meets.find(x=>x.id===sel);if(!m||!uid||!db||!isOpen(m))return;
  const by={...(votes[uid]||{})};
  if(by[m.id]===eid)delete by[m.id];else by[m.id]=eid;
  votes[uid]=by;render();
  try{await db.collection('votes').doc(uid).set({byMeet:by});}catch(e){}
}

document.addEventListener('change',async ev=>{
  const el=ev.target.closest&&ev.target.closest('[data-act="sv"]');if(!el||!db)return;
  const m=meets.find(x=>x.id===sel);if(!m)return;
  const v=Math.max(0,Math.floor(+el.value)||0);
  await db.collection('meets').doc(m.id).update({entrants:m.entrants.map(e=>e.id===el.dataset.id?{...e,sv:v}:e)});
});
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('.tab');
  if(tb){tab=tb.dataset.tab;sel=null;return render();}
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='open'){sel=id;render();}
  else if(a==='back'){sel=null;render();}
  else if(a==='addMeet'){
    const name=$('mName').value.trim();if(!name||!db)return;
    await db.collection('meets').doc(rid()).set({name,date:$('mDate').value,deadline:'',entrants:[]});
    $('mName').value='';$('mDate').value='';
  }
  else if(a==='delMeet'){
    if(confirm('Delete this meet and its entries?')){const i=sel;sel=null;await db.collection('meets').doc(i).delete();}
  }
  else if(a==='addEntry')addEntry();
  else if(a==='setDead'||a==='clearDead'){
    const m=meets.find(x=>x.id===sel);if(!m||!db)return;
    if(a==='clearDead')$('dDead').value='';
    await db.collection('meets').doc(m.id).update({deadline:dl($('dDead').value)});
  }
  else if(a==='vote')vote(id);
  else if(a==='delEntry'){
    const m=meets.find(x=>x.id===sel);
    if(m&&confirm('Remove this entry?'))await db.collection('meets').doc(m.id).update({entrants:m.entrants.filter(e=>e.id!==id)});
  }
});
</script>
</body>
</html>
